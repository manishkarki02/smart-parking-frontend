services:
  frontend:
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - smart-parking-dev-network

volumes:
  node_modules:

networks:
  smart-parking-dev-network:
    external: true
