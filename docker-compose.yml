services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/manishkarki02/smart-parking-frontend:latest}
    container_name: smart-parking-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - smart-parking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  smart-parking-network:
    external: true
